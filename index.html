<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <title>Live In Marrakech — Immobilier de Luxe à Marrakech | Villas, Riads & Appartements</title>

    <meta name="robots" content="max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#211f1b" />

    <!-- Per-page tags (description, canonical, hreflang, Open Graph, JSON-LD): SEOHead,
         written into the static HTML by the build-time pre-render (scripts/prerender.mjs). -->
    <!--app-head-->

    <!-- Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://iyrqhprjwsaxfbtfpetj.supabase.co" />

    <!-- Google Fonts — non-blocking with display=swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" media="print" onload="this.media='all'" />

    <!-- AI/LLM Discoverability -->
    <link rel="author" href="/humans.txt" />

    <!-- Structured Data (JSON-LD) -->
    <!-- RealEstateAgent: same name, phone, email and area as the footer (src/content/agency.ts).
         No aggregateRating/review here: add them only from real Google Business Profile reviews,
         shown on the page as well. TODO À CONFIRMER: street address, opening hours, geo. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "RealEstateAgent",
          "@id": "https://liveinmarrakech.com/#business",
          "name": "Live In Marrakech",
          "alternateName": "LiveInMarrakech",
          "description": "Agence immobilière à Marrakech (Gueliz) : vente, location longue durée, sous-location et séjours de courte durée.",
          "url": "https://liveinmarrakech.com",
          "logo": "https://liveinmarrakech.com/logo.jpg",
          "image": "https://liveinmarrakech.com/og-image.jpg",
          "telephone": "+212605387041",
          "email": "contact@liveinmarrakech.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Marrakech",
            "addressRegion": "Marrakech-Safi",
            "addressCountry": "MA"
          },
          "areaServed": { "@type": "City", "name": "Marrakech" },
          "sameAs": [
            "https://www.instagram.com/liveinmarrakech"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://liveinmarrakech.com/#website",
          "name": "Live In Marrakech",
          "alternateName": ["LiveInMarrakech", "liveinmarrakech.com"],
          "url": "https://liveinmarrakech.com",
          "publisher": { "@id": "https://liveinmarrakech.com/#business" },
          "inLanguage": ["fr", "en", "es"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://liveinmarrakech.com/catalogue?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
