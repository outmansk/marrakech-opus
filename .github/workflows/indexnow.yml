name: IndexNow

# After each production deployment on Vercel, tell Bing which pages changed (scripts/indexnow.mjs).
# Run it by hand ("Run workflow", all = true) after adding new pages whose lastmod is old.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: "Envoyer tout le sitemap"
        type: boolean
        default: false

jobs:
  indexnow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
