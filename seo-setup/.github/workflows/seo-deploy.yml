name: 'SEO & Deploy Pipeline'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Regenerate sitemap daily at 6:00 AM UTC
    - cron: '0 6 * * *'

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
  VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

jobs:
  # ── SEO Validation ────────────────────────────────────────
  seo-check:
    name: '🔍 SEO Validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate robots.txt exists
        run: |
          if [ ! -f "public/robots.txt" ]; then
            echo "❌ robots.txt missing from public/"
            exit 1
          fi
          echo "✅ robots.txt found"

      - name: Validate sitemap.xml structure
        run: |
          if [ ! -f "public/sitemap.xml" ]; then
            echo "⚠️  Static sitemap.xml not found, generating..."
          else
            echo "✅ sitemap.xml found"
            # Basic XML validation
            python3 -c "
          import xml.etree.ElementTree as ET
          try:
              ET.parse('public/sitemap.xml')
              print('✅ sitemap.xml is valid XML')
          except Exception as e:
              print(f'❌ sitemap.xml invalid: {e}')
              exit(1)
          "
          fi

      - name: Check meta tags in index.html
        run: |
          echo "Checking index.html meta tags..."
          grep -q 'og:title' index.html && echo "✅ og:title" || echo "❌ og:title missing"
          grep -q 'og:description' index.html && echo "✅ og:description" || echo "❌ og:description missing"
          grep -q 'og:image' index.html && echo "✅ og:image" || echo "❌ og:image missing"
          grep -q 'twitter:card' index.html && echo "✅ twitter:card" || echo "❌ twitter:card missing"
          grep -q 'canonical' index.html && echo "✅ canonical" || echo "❌ canonical missing"
          grep -q 'hreflang' index.html && echo "✅ hreflang" || echo "❌ hreflang missing"
          grep -q 'application/ld+json' index.html && echo "✅ JSON-LD" || echo "❌ JSON-LD missing"

  # ── Generate Dynamic Sitemap ──────────────────────────────
  generate-sitemap:
    name: '🗺️ Generate Sitemap'
    runs-on: ubuntu-latest
    needs: seo-check
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env for sitemap generation
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Generate dynamic sitemap
        run: node scripts/generate-sitemap.cjs

      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          git diff --cached --quiet || git commit -m "chore(seo): auto-update sitemap.xml [skip ci]"
          git push || echo "Nothing to push"

  # ── Build & Lighthouse ────────────────────────────────────
  build-and-audit:
    name: '🏗️ Build & Lighthouse'
    runs-on: ubuntu-latest
    needs: seo-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Verify build output
        run: |
          echo "📦 Build output:"
          ls -la dist/
          echo ""
          echo "Checking critical files in dist/..."
          [ -f dist/index.html ] && echo "✅ index.html" || echo "❌ index.html missing"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
